<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja de Discos de Vinil</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="imagens/logo.jpg" alt="Loja de Discos de Vinil">
        </div>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Rock (80s, 90s, 2000)</a></li>
                <li><a href="#">Pop Rock (80s, 90s, 2000)</a></li>
                <li><a href="#">Jazz</a></li>
                <li><a href="#">Músicas Clássicas</a></li>
                <li><a href="#">MPB</a></li>
                <li><a href="#">Sertanejos</a></li>
                <li><a href="#">Sertanejos Universitários</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="gallery">
            <h2>Explore Nossos Discos</h2>
            <div class="product">
                <img id="img-rock" src="imagens/rock-disco.jpg" alt="Disco de Rock">
                <h3>Rock</h3>
                <p>Preço: R$ 100</p>
            </div>
            <div class="product">
                <img id="img-pop-rock"src="imagens/pop-rock-disco.jpg" alt="Disco de Pop Rock">
                <h3>Pop Rock</h3>
                <p>Preço: R$ 150</p>
            </div>
            <!-- Mais produtos -->
        </section>
    </main>
    <footer>
        <p>Endereço: Rua das Flores, 123 - Bairro, Cidade, Estado</p>
        <button onclick="window.location.href='https://wa.me/12345678901'">Entre em contato!</button>
    </footer>
    <script src="script.js"></script>
</body>
</html>
